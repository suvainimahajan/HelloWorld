div{
    display: flex;

<body> 
<div></div>
</body>
<script>
    function updateTime(){
        let el = document.body.children[0];
        let t = new Date();
        el.innerText = t.toLocaleString();
    }
    setInterval(updateTime, 1000);
</script>
