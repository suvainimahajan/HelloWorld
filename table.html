<html>
    <head> 

    </head>
    <body>
        <table id="abc" border="1"> 
            <tr> 
                <td> 
                    Number
                </td>
                <td>
                    Square
                </td>
                <td> 
                    Cube
                </td>
            </tr>
        </table>
        <script>
            for(let i=1;i<21;i++){
                setTimeout(() =>{
            let t=document.getElementById("abc")
            let row=document.createElement("tr")
            let td1=document.createElement("td")
            let td2=document.createElement("td")
            let td3=document.createElement("td")
            td1.innerText=i
            td2.innerText=i*i
            td3.innerText=i*i*i
            t.appendChild(row)
            row.appendChild(td1)
            row.appendChild(td2)
            row.appendChild(td3)

            },i*1000);
            }
        </script>
    </body>
</html>
