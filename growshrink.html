<html>
<head> 
    <style>
div{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

</style>
</head>
<body> 
<div>Hello World</div>
</body>
<script>
    let mySize = 20;
    let growing = true;
    let el = document.body.children[0];
        function growShrink(){
        if(growing){
            mySize = mySize + 2;
            el.innerText = "Growing";
            if(mySize > 200) growing = false;
        }
        else{
             mySize = mySize - 2;
            el.innerText = "Shrinking";
            if(mySize > 200) growing = true;
        }
        el.style.fontSize = mySize + 'px';
    }
    setInterval(growShrink,100);
</script>
</html>
